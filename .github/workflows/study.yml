name: study
on:
  # kein Zeitplan: die volle Studie dauert Stunden und läuft lokal (python -m activist.cli study);
  # manuell auslösbar, wenn Actions-Minuten verfügbar sind
  workflow_dispatch:
    inputs:
      reuse:
        description: "nur Statistik aus den gespeicherten Trades neu berechnen, ohne Kursabruf"
        type: boolean
        default: false
      confirmed_only:
        description: "Kampagnen ohne Identitätsnachweis vor Kursabruf ausschließen"
        type: boolean
        default: false
      fill:
        description: "nur Tiingo-Kurs-Cache für qualifizierte US-Kampagnen nachladen (kein Bericht)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: study-${{ github.ref }}-${{ inputs.confirmed_only }}
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with: {path: "data/cache\ndata/prices", key: "study-cache-${{ github.run_id }}", restore-keys: "study-cache-"}
      - env:
          PYTHONPATH: src
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        timeout-minutes: 300           # danach wird der Cache trotzdem gespeichert
        run: ${{ inputs.fill && 'python -m activist.cli fill-prices' || format('python -m activist.cli study --since 2015-01-01 {0} {1}', inputs.reuse && '--reuse' || '', inputs.confirmed_only && '--confirmed-only' || '') }}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: "data/cache\ndata/prices", key: "study-cache-${{ github.run_id }}"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-study-${{ github.run_id }}
          path: reports/
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "activist-bot"; git config user.email "actions@users.noreply.github.com"
          git add reports && git diff --cached --quiet || (git commit -m "report: Ereignisstudie $(date -u +%F)" && ok=0; for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && { ok=1; break; }; sleep $((RANDOM % 30 + 10)); done; [ $ok = 1 ])
