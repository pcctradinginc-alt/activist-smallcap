name: backfill_jp
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-write-jp
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        range:   # EDINET hält Großaktionärsmeldungen ca. 5 Jahre vor
          - {start: "2021-11-01", end: "2022-06-30"}
          - {start: "2022-07-01", end: "2023-02-28"}
          - {start: "2023-03-01", end: "2023-10-31"}
          - {start: "2023-11-01", end: "2024-06-30"}
          - {start: "2024-07-01", end: "2025-02-28"}
          - {start: "2025-03-01", end: "2025-10-31"}
          - {start: "2025-11-01", end: "2026-06-30"}
          - {start: "2026-07-01", end: "2026-11-13"}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase || true
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python -m activist.cli backfill-jp --start ${{ matrix.range.start }} --end ${{ matrix.range.end }}
      - if: always()
        run: |
          git config user.name "activist-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/events && git diff --cached --quiet || (git commit -m "data: EDINET ${{ matrix.range.start }}..${{ matrix.range.end }}" && ok=0; for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && { ok=1; break; }; sleep $((RANDOM % 30 + 10)); done; [ $ok = 1 ])
