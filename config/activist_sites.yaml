  - {activist: Enkraft Capital, url: "https://enkraft.de", reason: "Einseiter ohne News (enkraft.com liefert 403)"}
  - {activist: Teleios Capital, url: "https://www.teleioscapital.com", reason: "Einseiter; robots.txt: Disallow /documents/"}
  - {activist: Cevian Capital, url: "https://cevian.com", reason: "keine Pressebereich/Briefe (nur Portfolio-Logos)"}
  - {activist: Elliott Investment Management, url: "https://www.elliottmgmt.com", reason: "kein News-Bereich; Briefe via elliottletters.com (aktiv)"}
  - {activist: Bluebell Capital, url: "https://www.bluebellcapital.com", reason: "Squarespace-Visitenkarte ohne News (Briefe laufen über Medien/Businesswire)"}
  - {activist: Sherborne Investors, url: "https://www.sherborneinvestors.com", reason: "Visitenkarte ohne News"}
  - {activist: Amber Capital, url: "https://www.amber-capital.com", reason: "Parking-Page"}
  - {activist: Harwood Capital, url: "https://www.harwoodcapital.co.uk", reason: "keine News"}
  - {activist: Shareholder Value Management AG, url: "https://www.shareholdervalue.de", reason: "Medien-/Infoseite, keine Kampagnen"}
  - {activist: Palliser Capital, reason: "Veröffentlichungen nur über Businesswire (kein eigener Newsbereich auffindbar)"}
  - {activist: Stuttgarter Börse / Düsseldorf / Hamburg, reason: "nur Universum, nicht Kampagnen"}
